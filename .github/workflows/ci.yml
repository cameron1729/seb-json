name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  automation:
    name: Workflow automation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate workflow syntax
        uses: docker://ghcr.io/kjanat/actionlint:1.17.0@sha256:d484cccadf56b6a356466ade9af4c8e05c5dce1badaf0a9ecd0d7639d68d9c92

      - name: Audit workflow security
        uses: docker://ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9
        with:
          args: --offline .

  support:
    name: PHP support matrix
    runs-on: ubuntu-latest

    outputs:
      latest: ${{ steps.support.outputs.latest }}
      versions: ${{ steps.support.outputs.versions }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read PHP support manifest
        id: support
        run: |
          echo "latest=$(jq --exit-status --raw-output '.latestPhp' .github/php-support.json)" >> "$GITHUB_OUTPUT"
          echo "versions=$(jq --exit-status --compact-output '.phpVersions' .github/php-support.json)" >> "$GITHUB_OUTPUT"

  test:
    name: PHP ${{ matrix.php }}
    needs: support
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.support.outputs.versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: dom, mbstring, simplexml, xml, xmlwriter
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate platform requirements
        run: composer check-platform-reqs --lock

      - name: Audit Composer dependencies
        run: composer audit --locked

      - name: Run checks
        run: composer check

  coverage:
    name: Coverage
    needs: support
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ needs.support.outputs.latest }}
          coverage: pcov
          extensions: dom, mbstring, simplexml, xml, xmlwriter
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check coverage
        run: composer coverage
